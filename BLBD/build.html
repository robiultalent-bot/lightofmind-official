<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>BLBD রেডিও তালিকা তৈরি</title>
<style>
:root{--bg:#080d1c;--card:#131c36;--gold:#f2b84b;--tx:#f3f0e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali",system-ui,sans-serif;font-size:18px;line-height:1.7}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{color:var(--gold);font-size:28px}
.c{background:var(--card);border-radius:16px;padding:14px;margin:12px 0}
button,.bk{font:inherit;font-weight:700;background:var(--gold);color:#241a04;border:0;border-radius:10px;padding:12px 16px;margin:6px 6px 0 0;text-decoration:none;display:inline-block}
input{width:100%;font:inherit;padding:10px;border-radius:10px;border:2px solid #2a3a6b;background:#080d1c;color:var(--tx);margin-top:6px}
label{display:block;margin-top:8px}
a{color:#ffd37a}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
#yt{position:absolute;left:-9999px;width:200px;height:200px}
</style>
</head>
<body>
<div class="w">
<a class="bk" href="./">← রেডিওতে ফিরুন</a>
<h1>রেডিও তালিকা তৈরি</h1>
<p>এই পাতা একবার চালালে রেডিওর সব গানের সময়ের তালিকা তৈরি হয়ে যায়। তখন যে-ই রেডিওতে ঢুকবে, ঘড়ি ধরে ঠিক চলমান গানের মাঝখান থেকে শুনবে। নতুন গান যোগ করলে আবার চালান।</p>
<div class="c">
 <label for="ex">আরও প্লেলিস্ট আইডি (ঐচ্ছিক, কমা দিয়ে আলাদা করুন)</label>
 <input id="ex" type="text" autocomplete="off">
 <button id="go" type="button">▶ তালিকা তৈরি শুরু করুন</button>
</div>
<div class="c" role="status" aria-live="polite" id="st">তৈরি। শুরু বোতাম চাপুন।</div>
<div class="c" id="rs"></div>
</div>
<div id="yt"></div>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function say(t){$("st").textContent=t}
function okId(s){return /^[A-Za-z0-9_-]{11}$/.test(s||"")}
function okPl(s){return /^[A-Za-z0-9_-]{10,60}$/.test(s||"")}
var C={},player=null,ready=false,waitR=null;
var MIN=30,MAX=900,EVERY=3,JD=10;
var STATIONS=["j1","j2","j3","j4"];
function fbBase(){var u=(C.firebaseUrl||"").replace(/\/+$/,"");return /^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(u)?u+"/blbd":""}
window.onYouTubeIframeAPIReady=function(){
 player=new YT.Player("yt",{width:"200",height:"200",playerVars:{playsinline:1},events:{
  onReady:function(){ready=true;$("go").disabled=false},
  onStateChange:function(e){if(waitR&&e.data===5)waitR("ok")},
  onError:function(){if(waitR)waitR("err")}
 }});
};
function waitEvent(ms){return new Promise(function(res){var t=setTimeout(function(){waitR=null;res("timeout")},ms);waitR=function(v){clearTimeout(t);waitR=null;res(v)}})}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
fetch("config.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){C=d;var s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)}).catch(function(){say("কনফিগ ফাইল লোড হয়নি।")});
$("go").disabled=true;
async function getIds(pl){
 player.cuePlaylist({listType:"playlist",list:pl});
 var r=await waitEvent(8000);
 var ids=[];try{ids=(player.getPlaylist()||[]).filter(okId)}catch(e){}
 return ids;
}
async function measure(id){
 player.cueVideoById(id);
 var r=await waitEvent(7000);
 if(r!=="ok")return null;
 /* আগের ভিডিওর পুরনো নাম ও সময় যেন না ধরা পড়ে, তাই আইডি মিলে যাওয়া পর্যন্ত অপেক্ষা */
 var d=0,t="",k,vid="",last=-1,same=0;
 for(k=0;k<20;k++){
  try{var vd=player.getVideoData()||{};vid=String(vd.video_id||"");t=String(vd.title||"");d=Math.round(player.getDuration())}catch(e){}
  if(vid===id&&t&&d>0){
   if(d===last){same++}else{same=0;last=d}
   if(same>=2)break;
  }
  await sleep(300);
 }
 if(vid!==id||!t||!(d>0))return null;
 return {id:id,d:d,t:t.slice(0,100)};
}
$("go").onclick=async function(){
 $("go").disabled=true;
 var b=fbBase();if(!b){say("ফায়ারবেসের ঠিকানা নেই। config.json দেখুন।");return}
 var pls=(C.radio||[]).map(function(x){return x.playlist}).filter(okPl);
 $("ex").value.split(",").forEach(function(x){x=x.trim();if(okPl(x)&&pls.indexOf(x)<0)pls.push(x)});
 var all=[],i,j,cmap={};
 for(i=0;i<pls.length;i++){
  say("প্লেলিস্ট পড়া হচ্ছে ("+bn(i+1)+"/"+bn(pls.length)+")...");
  var ids=await getIds(pls[i]);
  ids.forEach(function(x){if(all.indexOf(x)<0){all.push(x);cmap[x]=pls[i]}});
 }
 if(!all.length){say("প্লেলিস্টে কোনো গান পাওয়া যায়নি। প্লেলিস্টটি সবার জন্য খোলা (পাবলিক) কিনা দেখুন।");$("go").disabled=false;return}
 say("মোট "+bn(all.length)+"টি ভিডিও পাওয়া গেছে। এখন প্রতিটির সময় মাপা হচ্ছে। এতে কয়েক মিনিট লাগবে। পাতা বন্ধ করবেন না।");
 var good={},bad=0;
 for(j=0;j<all.length;j++){
  var m=await measure(all[j]);
  if(m&&m.d>=MIN&&m.d<=MAX)good[all[j]]=m;else bad++;
  if((j+1)%10===0||j===all.length-1)say(bn(j+1)+"/"+bn(all.length)+" মাপা হয়েছে। ঠিক আছে "+bn(Object.keys(good).length)+"টি, বাদ "+bn(bad)+"টি।");
 }
 var good_ids=all.filter(function(x){return good[x]});
 if(good_ids.length<2){say("চালানোর মতো গান পাওয়া যায়নি। ভিডিওগুলো বাইরে চালানোর অনুমতি দেওয়া আছে কিনা দেখুন।");$("go").disabled=false;return}
 var prev=null;try{prev=await fetch(b+"/schedule.json",{cache:"no-store"}).then(function(r){return r.json()})}catch(e){}
 var kept=[];
 if(prev&&prev.items)prev.items.forEach(function(it){if(it.id&&good[it.id]&&kept.indexOf(it.id)<0)kept.push(it.id)});
 var fresh=good_ids.filter(function(x){return kept.indexOf(x)<0});
 for(i=fresh.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));var tmp=fresh[i];fresh[i]=fresh[j];fresh[j]=tmp}
 var songs=kept.concat(fresh),items=[],jn=0;
 songs.forEach(function(id,n){
  items.push({id:id,d:good[id].d,t:good[id].t,p:cmap[id]||""});
  if((n+1)%EVERY===0)items.push({j:STATIONS[jn++%STATIONS.length],d:JD});
 });
 var total=0;items.forEach(function(it){total+=it.d});
 var res=await fetch(b+"/schedule.json",{method:"PUT",body:JSON.stringify({epoch:(prev&&prev.epoch)||Date.UTC(2026,10,14),total:total,items:items,upd:Date.now()})});
 if(res.ok){
  say("তালিকা তৈরি হয়েছে। "+bn(songs.length)+"টি গান, মোট প্রায় "+bn(Math.round(total/360)/10)+" ঘণ্টার চক্র। এখন রেডিওতে গিয়ে চালান।");
  $("rs").textContent="গান: "+songs.length+", স্টেশন ঘোষণা: "+(items.length-songs.length)+", বাদ পড়া: "+bad;
 }else say("ফায়ারবেসে লেখা যায়নি। ডাটাবেসের নিয়ম দেখুন।");
 $("go").disabled=false;
};
})();
</script>
</body>
</html>
